<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5d3b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="review.webmanifest"><title>研究Ⅱ · 模拟审查</title><link rel="stylesheet" href="review.css"></head>
<body>
<header class="review-header"><h1>研究Ⅱ <span>模拟审查</span></h1><span class="review-meta">中文讲稿 · 第13稿</span><div class="header-actions"><nav class="review-scope" aria-label="审查范围"><a href="review.html" data-review-scope="main">发表</a><a href="review.html?scope=supplement" data-review-scope="supplement">补充</a></nav><div class="language-mode" aria-label="画面语言"><button data-deck-language="zh" aria-pressed="true" title="中文画面">中</button><button data-deck-language="ja" aria-pressed="false" title="日文画面">日</button></div><button id="fullscreen" class="icon-button" title="全屏" aria-label="全屏">⛶</button></div></header>
<main class="review-workspace"><div class="stage"><div class="slide-review-tools" role="toolbar" aria-label="Slide批注"><button id="annotate-slide-text" disabled title="选中Slide文字后添加批注"><span aria-hidden="true">T</span> 批注选文</button><button id="annotate-slide-region" aria-pressed="false" title="拖动框选Slide区域，Esc取消"><span aria-hidden="true">▧</span> 框选区域</button><button id="annotate-slide-page" title="对当前整页Slide添加意见"><span aria-hidden="true">□</span> 整页意见</button><span id="slide-review-status" role="status"></span></div><iframe id="deck-frame" title="研究Ⅱ发表幻灯片" allow="autoplay; fullscreen"></iframe><div id="loading-frame">准备画面…</div></div>
<aside class="inspector"><div class="inspector-tabs" role="tablist"><button id="editor-tab" role="tab" aria-selected="true" aria-controls="editor-panel">讲稿编辑</button><button id="transcript-tab" role="tab" aria-selected="false" aria-controls="transcript-panel">中文音频稿</button><button id="notes-tab" role="tab" aria-selected="false" aria-controls="notes-panel">意见 <span id="notes-count">0</span></button></div>
<section id="editor-panel" role="tabpanel" aria-labelledby="editor-tab"><iframe id="script-editor-frame" title="统一双语讲稿编辑器"></iframe></section>
<section id="transcript-panel" role="tabpanel" aria-labelledby="transcript-tab" hidden><div class="transcript-tools"><button id="edit-script" aria-pressed="false">编辑讲稿</button><button id="annotate-selection" disabled>批注选文</button><button id="export-script" class="icon-button" title="导出修改后的讲稿" aria-label="导出修改后的讲稿">↓</button><span id="draft-status" role="status">原稿</span></div><div id="clip-list"></div></section>
<section id="notes-panel" role="tabpanel" aria-labelledby="notes-tab" hidden><div class="notes-tools"><span id="storage-status">本机保存</span><button id="export-notes" class="icon-button" title="导出审查意见与讲稿修改" aria-label="导出审查意见与讲稿修改">↓</button></div><form id="note-form"><label for="note-text" id="note-context">第01页 · 00:00</label><blockquote id="note-quote" hidden></blockquote><textarea id="note-text" placeholder="记录这一处的问题…" rows="3"></textarea><div class="note-form-actions"><button id="cancel-note" type="button">取消</button><button id="save-note" type="submit" disabled>保存意见</button></div></form><div id="notes-list"></div></section>
</aside></main>
<footer class="player"><div class="progress-line"><span id="elapsed">00:00</span><input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="播放进度"><span id="duration">00:00</span></div><div class="transport-line"><div class="transport-buttons"><button id="previous" class="icon-button" title="上一段" aria-label="上一段">|‹</button><button id="replay" class="icon-button" title="重听当前段" aria-label="重听当前段">↺</button><button id="play" class="icon-button primary" title="播放" aria-label="播放" disabled>▶</button><button id="next-clip" class="icon-button" title="下一段" aria-label="下一段">›|</button></div><div class="play-state"><span id="status" role="status">准备音频…</span><span id="position">第01页 · 第01段 / 21</span></div><div class="player-actions"><label class="rate-label">语速 <select id="rate" aria-label="语速"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label><button id="add-note" title="暂停并记录当前意见">＋ 记意见</button></div></div></footer>
<audio id="narration" preload="auto"></audio>
<script src="review-core.js"></script><script src="review-data.js"></script><script src="review-slide.js"></script><script src="script-core.js"></script><script src="review.js"></script><script src="review-offline.js"></script><script src="review-mobile.js"></script>
</body></html>
